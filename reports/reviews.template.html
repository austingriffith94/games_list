<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Reviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&display=swap">
<style>
/* Generated by build_reviews.py from the app's Reviews tab. Layout: a spectrum of tiers (worst to best).
   Home = hero + one block per review + sticky tier rail + tier sections.
   Review = narrow reading column, figures break out wider, a library-details panel, tier colour through header and progress bar. */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --ink: #161a22; --muted: #566073; --line: #dce0e8; --hover: #eaedf3;
  --tl: 36%; --ts: 74%; --cl: 46%; --cs: 58%;
  --font-display: "Bricolage Grotesque", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-read: "Literata", Georgia, "Times New Roman", serif;
  --gutter: clamp(16px, 4vw, 40px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1218; --surface: #161b23; --ink: #e9edf3; --muted: #98a2b3; --line: #252c37; --hover: #1e252f;
    --tl: 68%; --ts: 80%; --cl: 56%; --cs: 62%; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1218; --surface: #161b23; --ink: #e9edf3; --muted: #98a2b3; --line: #252c37; --hover: #1e252f;
  --tl: 68%; --ts: 80%; --cl: 56%; --cs: 62%; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-display); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--tc, var(--ink)); outline-offset: 3px; border-radius: 4px; }
.tier { --tc: hsl(var(--h) var(--ts) var(--tl)); --cc: hsl(var(--h) var(--cs) var(--cl)); }

/* ---------- header ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 56px; }
.brand { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; display: inline-flex; align-items: center; gap: 10px; }
.brand-mark { display: inline-flex; gap: 2px; }
.brand-mark i { width: 4px; height: 16px; border-radius: 1px; background: hsl(var(--h) var(--cs) var(--cl)); }
.back { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; color: var(--muted); font-size: .95rem; }
.back:hover { color: var(--ink); }
.back svg { width: 16px; height: 16px; }
.draft-flag { font-size: .8rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--tc); border: 1.5px solid currentColor; border-radius: 6px; padding: 2px 8px; }
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; transform-origin: 0 50%; transform: scaleX(0); background: var(--cc); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: var(--gutter); }

/* ---------- home: hero ---------- */
.hero { padding-block: clamp(36px, 7vw, 76px) 28px; }
.hero h1 { margin: 0; font-weight: 800; font-stretch: 75%; font-size: clamp(3.6rem, 13vw, 9.5rem); line-height: .86; letter-spacing: -0.025em; text-wrap: balance; }
.hero-sub { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; margin-top: 22px; }
.hero-sub p { margin: 0; font-family: var(--font-read); font-size: 1.15rem; line-height: 1.55; max-width: 40rem; }
.hero-sub .by { font-weight: 600; color: var(--muted); font-size: .95rem; }
.strip { display: flex; gap: clamp(4px, 1vw, 10px); margin-top: 8px; }
.grp { display: flex; gap: clamp(1.5px, .3vw, 3px); min-width: 0; align-items: flex-end; padding-block: 6px; }
.cell { flex: 1 1 0; min-width: 0; height: 38px; border-radius: 3px; background: hsl(var(--h) var(--cs) var(--cl)); transform-origin: 50% 100%; animation: rise .5s ease-out both; animation-delay: calc(var(--i) * 14ms); transition: transform .15s; }
.cell.ghost { background: hsl(var(--h) var(--cs) var(--cl) / .14); box-shadow: inset 0 0 0 1px hsl(var(--h) var(--cs) var(--cl) / .5); }
.grp:hover .cell, .grp:focus-visible .cell { transform: translateY(-4px); }
@keyframes rise { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
.strip-ends { display: flex; justify-content: space-between; gap: 16px; margin-top: 2px; font-weight: 700; font-stretch: 75%; font-size: 1.05rem; }
.strip-note { margin: 10px 0 0; min-height: 1.5em; color: var(--muted); font-size: .95rem; display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: center; }
.key { display: inline-flex; align-items: center; gap: 8px; }
.key i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
.key .k-full { background: var(--muted); }
.key .k-wait { box-shadow: inset 0 0 0 1.5px var(--muted); opacity: .8; }

/* ---------- home: rail + tiers ---------- */
.layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: clamp(32px, 5vw, 64px); padding-block: 28px 80px; align-items: start; }
.rail { position: sticky; top: 80px; display: flex; flex-direction: column; gap: 2px; }
.rail-h { font-weight: 600; font-size: .85rem; color: var(--muted); margin: 0 0 8px 12px; }
.rail a { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 8px; font-weight: 500; font-size: .95rem; color: var(--muted); }
.rail a i { flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--cc); }
.rail a b { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; font-size: .85rem; opacity: .7; }
.rail a:hover { background: var(--hover); color: var(--ink); }
.rail a.on { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.rail a span { min-width: 0; }
.sec { padding-block: 40px 44px; border-top: 1px solid var(--line); scroll-margin-top: 72px; }
.sec:first-child { border-top: 0; padding-top: 8px; }
.sec-head { display: flex; flex-direction: column; gap: 14px; margin-bottom: 26px; }
.sec.empty .sec-head { margin-bottom: 0; }
.where { display: flex; align-items: flex-end; gap: 14px; color: var(--muted); font-size: .9rem; font-weight: 500; }
.ticks { display: inline-flex; gap: 3px; align-items: flex-end; }
.ticks i { width: 7px; height: 9px; border-radius: 2px; background: hsl(var(--h) var(--cs) var(--cl) / .35); display: block; }
.ticks i.on { height: 18px; background: hsl(var(--h) var(--cs) var(--cl)); }
.sec h2 { margin: 0; font-weight: 800; font-stretch: 75%; font-size: clamp(2.4rem, 6vw, 4rem); line-height: .95; letter-spacing: -0.02em; color: var(--tc); text-wrap: balance; }
.sec-desc { margin: 0; font-family: var(--font-read); font-size: 1.05rem; line-height: 1.65; max-width: 44rem; text-wrap: pretty; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 18px; }
.card { display: flex; flex-direction: column; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; transition: border-color .15s; }
.card:hover { border-color: var(--tc); }
.card-img { aspect-ratio: 16 / 9; overflow: hidden; background: var(--hover); }
.card-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
.card-img.cover img { object-position: center 18%; }
.card:hover .card-img img { transform: scale(1.03); }
.card-body { display: flex; flex-direction: column; gap: 8px; padding: 16px 18px 18px; flex: 1; }
.card h3 { margin: 0; font-weight: 700; font-size: 1.3rem; line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; }
.card p { margin: 0; font-family: var(--font-read); font-size: .95rem; line-height: 1.55; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { margin-top: auto; padding-top: 4px; font-size: .85rem; font-weight: 600; color: var(--tc); display: flex; gap: 14px; flex-wrap: wrap; }
.foot { padding-block: 32px 56px; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }

/* ---------- review ---------- */
.rv-head { padding-block: clamp(32px, 6vw, 64px) 32px; max-width: 62rem; margin-inline: auto; }
.crumb { display: inline-flex; align-items: flex-end; gap: 14px; font-weight: 600; font-size: .95rem; color: var(--tc); }
.crumb:hover { text-decoration: underline; text-underline-offset: 4px; }
.rv-head h1 { margin: 18px 0 0; font-weight: 800; font-stretch: 75%; font-size: clamp(2.6rem, 8vw, 5.4rem); line-height: .9; letter-spacing: -0.025em; text-wrap: balance; }
.rv-meta { display: flex; flex-wrap: wrap; gap: 4px 24px; margin-top: 22px; color: var(--muted); font-weight: 500; font-size: .95rem; font-variant-numeric: tabular-nums; }

/* library details panel */
.facts { max-width: 62rem; margin: 0 auto 48px; display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 24px; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.facts.nocover { grid-template-columns: minmax(0, 1fr); }
.facts .cv { width: 128px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 8px; display: block; background: var(--hover); }
.fx-top { display: flex; flex-wrap: wrap; gap: 12px 36px; align-items: flex-end; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.fx-big { display: flex; flex-direction: column; }
.fx-big span { font-size: .8rem; font-weight: 600; color: var(--muted); }
.fx-big b { font-weight: 800; font-stretch: 75%; font-size: 2.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.fx-big b small { font-size: .45em; font-weight: 600; color: var(--muted); margin-left: 2px; }
.fx-big.mine b { color: var(--tc); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; align-self: center; }
.badges span { font-size: .78rem; font-weight: 700; letter-spacing: .02em; border: 1.5px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
.badges span.hi { border-color: var(--cc); color: var(--tc); }
.fx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px 28px; margin: 16px 0 0; }
.fx-grid div { min-width: 0; }
.fx-grid dt { font-size: .8rem; font-weight: 600; color: var(--muted); }
.fx-grid dd { margin: 2px 0 0; font-weight: 500; font-size: .95rem; line-height: 1.4; font-variant-numeric: tabular-nums; }
.fx-grid dd .sub { color: var(--muted); }
.fx-chart { margin-top: 18px; }
.fx-chart h4 { margin: 0 0 8px; font-size: .8rem; font-weight: 600; color: var(--muted); }
.yrs { display: flex; align-items: stretch; gap: 2px; height: 64px; border-bottom: 1px solid var(--line); }
.yrs .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; cursor: default; }
.yrs .col i { display: block; background: var(--cc); border-radius: 4px 4px 0 0; }
.yrs .col:hover i, .yrs .col:focus-visible i { background: var(--tc); }
.yrs-ends { display: flex; justify-content: space-between; margin-top: 4px; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .8rem; font-weight: 600; padding: 4px 8px; border-radius: 6px; transform: translate(-50%, calc(-100% - 8px)); white-space: nowrap; }

.prose { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 44rem) minmax(0, 1fr); row-gap: 1.35rem; font-family: var(--font-read); font-size: clamp(1.06rem, 1.2vw + .8rem, 1.2rem); line-height: 1.72; padding-bottom: 48px; font-optical-sizing: auto; }
.prose > p { grid-column: 2; margin: 0; text-wrap: pretty; }
.prose > p:first-child { font-size: 1.14em; line-height: 1.6; }
.prose > figure { grid-column: 1 / -1; justify-self: center; width: min(100%, 62rem); margin: .9rem 0 .7rem; }
.prose > figure.small { grid-column: 2; justify-self: stretch; width: auto; }
.prose figure img { display: block; width: 100%; height: auto; border-radius: 8px; background: var(--hover); }
.prose figure.small img { max-width: 400px; }
.prose figcaption { margin: 12px auto 0; max-width: 44rem; font-style: italic; font-size: .88em; line-height: 1.55; color: var(--muted); text-wrap: pretty; }
.prose figure.small figcaption { margin-inline: 0; }
.prose .empty { grid-column: 2; color: var(--muted); font-style: italic; }
.filed { max-width: 44rem; margin: 8px auto 0; padding: 28px 0 0; border-top: 1px solid var(--line); }
.filed .lbl { font-weight: 500; font-size: .9rem; color: var(--muted); }
.filed h2 { margin: 6px 0 10px; font-weight: 800; font-stretch: 75%; font-size: 2.4rem; line-height: 1; color: var(--tc); }
.filed p { margin: 0 0 14px; font-family: var(--font-read); font-size: 1rem; line-height: 1.65; color: var(--muted); }
.filed a.more { font-weight: 600; color: var(--tc); }
.filed a.more:hover { text-decoration: underline; text-underline-offset: 4px; }
.nav2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; max-width: 62rem; margin: 48px auto 0; padding-bottom: 80px; }
.nav2 a { display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; transition: border-color .15s; min-width: 0; }
.nav2 a:hover { border-color: var(--tc); }
.nav2 .lbl { font-size: .85rem; font-weight: 500; color: var(--muted); }
.nav2 b { font-weight: 700; font-size: 1.3rem; line-height: 1.15; letter-spacing: -.01em; }
.nav2 .nt { font-size: .85rem; font-weight: 600; color: var(--tc); }
.nav2 a.next { text-align: right; }

/* ---------- narrow screens ---------- */
@media (max-width: 959px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 8px; padding-top: 12px; }
  .rail { position: static; flex-direction: row; overflow-x: auto; gap: 8px; padding-bottom: 8px; scrollbar-width: thin; }
  .rail-h { display: none; }
  .rail a { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
  .rail a b { display: none; }
  .rail a.on { box-shadow: none; border-color: var(--cc); }
  .cell { height: 30px; }
  .prose > p, .prose > figure.small, .prose .empty { grid-column: 1 / -1; }
  .nav2 a.next { text-align: left; }
}
@media (max-width: 600px) {
  .facts { grid-template-columns: minmax(0, 1fr); padding: 16px; }
  .facts .cv { width: 96px; }
  .badges { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .cell { animation: none; transition: none; }
  .card-img img { transition: none; }
}
</style>
</head>
<body>
<div id="app"></div>
<div class="tip" id="tip" hidden></div>
<script type="application/json" id="data">/*DATA*/</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  var tiers = D.tiers, IM = D.imgs, TH = D.thumbs;
  var AUTHOR = 'Austin Griffith';
  // worst -> best: red through green, best tier purple (the original page's spectrum, stretched to any tier count)
  var BASE_HUES = [0, 10, 22, 34, 46, 58, 78, 98, 116, 134, 268];
  var nT = tiers.length;
  function hueAt(i) {
    if (nT === BASE_HUES.length) return BASE_HUES[i];
    if (i === nT - 1) return 268;
    return Math.round(134 * i / Math.max(1, nT - 2));
  }
  var reviews = [], total = 0;
  tiers.forEach(function (t, i) {
    t.h = hueAt(i); t.i = i;
    t.id = 'tier-' + t.name.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    total += t.games.length;
    t.games.forEach(function (g) { g.tier = t; reviews.push(g); });
  });
  var app = document.getElementById('app'), tip = document.getElementById('tip');
  var cur = null, rendered = null, homeScroll = 0, spy = null;
  var BACK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>';
  var NUMS = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  function num(v, d) { return v == null ? '–' : (+v).toLocaleString('en-US', { maximumFractionDigits: d == null ? 1 : d }); }
  function month(iso) { return iso ? MON[+iso.slice(5, 7) - 1] + ' ' + iso.slice(0, 4) : ''; }
  function day(iso) { return iso ? MON[+iso.slice(5, 7) - 1] + ' ' + (+iso.slice(8, 10)) + ', ' + iso.slice(0, 4) : ''; }
  function ticks(i) {
    return '<span class="ticks" aria-hidden="true">' + tiers.map(function (t, j) {
      return '<i class="' + (j === i ? 'on' : '') + '" style="--h:' + t.h + '"></i>';
    }).join('') + '</span>';
  }
  function topbar(inner, cls, style) {
    return '<header class="bar ' + (cls || '') + '" id="bar"' + (style ? ' style="' + style + '"' : '') + '><div class="wrap bar-in">' + inner + '</div><div class="progress" id="prog"></div></header>';
  }
  function brand() {
    var mark = [0, .3, .6, .8, 1].map(function (f) { return '<i style="--h:' + hueAt(Math.round(f * (nT - 1))) + '"></i>'; }).join('');
    return '<a class="brand" href="#" data-go=""><span class="brand-mark" aria-hidden="true">' + mark + '</span>' + esc(AUTHOR.split(' ')[0]) + '’s Game Reviews</a>';
  }

  /* ---------- home ---------- */
  function home() {
    var idx = 0;
    var strip = tiers.map(function (t) {
      var n = t.games.length;
      var cells = n ? t.games.map(function () { return '<i class="cell" style="--i:' + (idx++) + '"></i>'; }).join('') : '<i class="cell ghost" style="--i:' + (idx++) + '"></i>';
      return '<a class="grp tier" href="#' + t.id + '" data-go="' + t.id + '" style="--h:' + t.h + ';flex:' + Math.max(1, n) + ' 1 0" data-note="' + esc(t.name) + (n ? ' has ' + plural(n, 'review') : ' has no reviews yet') + '" aria-label="' + esc(t.name) + ', ' + plural(n, 'review') + '">' + cells + '</a>';
    }).join('');
    var rail = '<nav class="rail" aria-label="Tiers"><p class="rail-h">Tiers, worst to best</p>' + tiers.map(function (t) {
      return '<a class="tier" href="#' + t.id + '" data-go="' + t.id + '" data-rail="' + t.id + '" style="--h:' + t.h + '"><i></i><span>' + esc(t.name) + '</span><b>' + t.games.length + '</b></a>';
    }).join('') + '</nav>';
    var secs = tiers.map(function (t) {
      var cards = t.games.length ? '<div class="cards">' + t.games.map(function (g) {
        var img = g.card ? '<div class="card-img"><img src="' + TH[g.card] + '" alt="" loading="lazy"></div>'
          : g.cover ? '<div class="card-img cover"><img src="' + g.cover + '" alt="" loading="lazy"></div>' : '';
        return '<a class="card" href="#' + g.slug + '" data-go="' + g.slug + '">' + img + '<div class="card-body"><h3>' + esc(g.title) + '</h3><p>' + esc(g.excerpt) + '</p><span class="meta"><span>' + g.mins + ' min read</span>' + (g.facts.score != null ? '<span>My score ' + num(g.facts.score) + '/10</span>' : '') + '</span></div></a>';
      }).join('') + '</div>' : '';
      return '<section class="sec tier' + (t.games.length ? '' : ' empty') + '" id="' + t.id + '" style="--h:' + t.h + '"><div class="sec-head"><div class="where">' + ticks(t.i) + '<span>Tier ' + (t.i + 1) + ' of ' + nT + '</span><span>' + (t.games.length ? plural(t.games.length, 'review') : 'No reviews yet') + '</span></div><h2>' + esc(t.name) + '</h2><p class="sec-desc">' + esc(t.desc) + '</p></div>' + cards + '</section>';
    }).join('');
    var noteDefault = '<span>' + plural(total, 'review') + ' across ' + nT + ' tiers. Each block is one review.</span><span class="key"><i class="k-full"></i>Review</span><span class="key"><i class="k-wait"></i>No reviews in that tier yet</span>';
    var lead = (NUMS[total] || total) + (total === 1 ? ' review' : ' reviews') + ' so far, each filed into one of ' + nT + ' tiers from ' + esc(tiers[0].name) + ' to ' + esc(tiers[nT - 1].name) + '.';
    app.innerHTML = topbar(brand()).replace('<div class="progress" id="prog"></div>', '') +
      '<main><div class="wrap"><div class="hero"><h1>Game Reviews</h1><div class="hero-sub"><p>' + lead + '</p><span class="by">by ' + esc(AUTHOR) + '</span></div></div>' +
      '<div class="strip" id="strip">' + strip + '</div>' +
      '<div class="strip-ends"><span class="tier" style="--h:' + tiers[0].h + ';color:var(--tc)">' + esc(tiers[0].name) + '</span><span class="tier" style="--h:' + tiers[nT - 1].h + ';color:var(--tc)">' + esc(tiers[nT - 1].name) + '</span></div>' +
      '<p class="strip-note" id="note">' + noteDefault + '</p></div>' +
      '<div class="wrap layout">' + rail + '<div>' + secs + '</div></div>' +
      '<div class="wrap"><div class="foot">Reviews by ' + esc(AUTHOR) + (D.built ? ' · built ' + day(D.built) : '') + '.</div></div></main>';
    var note = document.getElementById('note'), stripEl = document.getElementById('strip');
    function setNote(e) { var g = e.target.closest && e.target.closest('.grp'); if (g) note.textContent = g.getAttribute('data-note'); }
    function resetNote() { note.innerHTML = noteDefault; }
    stripEl.addEventListener('mouseover', setNote); stripEl.addEventListener('focusin', setNote);
    stripEl.addEventListener('mouseleave', resetNote); stripEl.addEventListener('focusout', resetNote);
    startSpy();
  }

  function startSpy() {
    if (spy) spy.disconnect();
    if (!('IntersectionObserver' in window)) return;
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        document.querySelectorAll('.rail a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-rail') === e.target.id); });
      });
    }, { rootMargin: '-20% 0px -70% 0px' });
    document.querySelectorAll('.sec').forEach(function (s) { spy.observe(s); });
  }

  /* ---------- review: library details ---------- */
  function factsPanel(g) {
    var f = g.facts, rows = [];
    function row(label, html) { if (html) rows.push('<div><dt>' + label + '</dt><dd>' + html + '</dd></div>'); }
    var big = '';
    if (f.score != null) big += '<div class="fx-big mine"><span>My score</span><b>' + num(f.score) + '<small>/10</small></b></div>';
    if (f.crit_avg != null) big += '<div class="fx-big"><span>Critic average</span><b>' + num(f.crit_avg, 0) + '<small>/100</small></b></div>';
    if (f.hours) big += '<div class="fx-big"><span>Time played</span><b>' + num(f.hours) + '<small>h</small></b></div>';
    var badges = [];
    if (f.top) badges.push('<span class="hi">Top 10 · #' + f.top + '</span>');
    if (f.goat) badges.push('<span class="hi">Wikipedia GOAT</span>');
    if (f.zp) badges.push('<span>Zero Punctuation: ' + esc(f.zp) + '</span>');
    if (f.soundtrack) badges.push('<span>Soundtrack owned</span>');
    row('Released', esc(day(f.released)));
    row('Genre', esc(f.genre) + (f.sub ? ' <span class="sub">· ' + esc(f.sub) + '</span>' : ''));
    row('Look', [f.view, f.style].filter(Boolean).map(esc).join(' · '));
    row('Series', f.series && esc(f.series));
    row('Played on', f.systems.map(function (s) { return esc(s.name) + ' <span class="sub">· ' + (s.hours ? num(s.hours) + ' h' : 'not played') + (s.kind && s.kind !== 'Retail' ? ' · ' + esc(s.kind) : '') + '</span>'; }).join('<br>'));
    row('Sessions', f.days ? plural(f.days, 'day') + ' played' + (f.first ? '<br><span class="sub">' + (month(f.first) === month(f.last) ? month(f.first) : month(f.first) + ' – ' + month(f.last)) + '</span>' : '') : '');
    row('Playthroughs', f.plays != null || f.avg_play ? (f.plays != null ? num(f.plays, 0) : '–') + (f.avg_play ? ' <span class="sub">· a typical run is ' + num(f.avg_play) + ' h</span>' : '') : '');
    row('Modes', f.modes.join(', '));
    row('Critics', f.crit.map(function (c) { return esc(c.n) + ' <span class="sub">' + num(c.v) + '</span>'; }).join('<br>'));
    if (f.goty) row('GOTY votes', num(f.goty, 0));
    var chart = '';
    if (f.years.length > 1) {
      var mx = Math.max.apply(null, f.years.map(function (y) { return y[1]; })) || 1;
      chart = '<div class="fx-chart"><h4>Hours played by year</h4><div class="yrs" role="img" aria-label="Hours played by year: ' + f.years.filter(function (y) { return y[1]; }).map(function (y) { return y[0] + ' ' + num(y[1]) + ' hours'; }).join(', ') + '">' +
        f.years.map(function (y) { return '<span class="col" tabindex="0" data-tip="' + y[0] + ' · ' + (y[1] ? num(y[1]) + ' h' : 'not played') + '"><i style="height:' + (y[1] ? Math.max(4, y[1] / mx * 100) : 0) + '%"></i></span>'; }).join('') +
        '</div><div class="yrs-ends"><span>' + f.years[0][0] + '</span><span>' + f.years[f.years.length - 1][0] + '</span></div></div>';
    }
    return '<section class="facts' + (g.cover ? '' : ' nocover') + '" aria-label="From my game library">' + (g.cover ? '<img class="cv" src="' + g.cover + '" alt="' + esc(g.title) + ' cover art">' : '') +
      '<div>' + (big || badges.length ? '<div class="fx-top">' + big + (badges.length ? '<div class="badges">' + badges.join('') + '</div>' : '') + '</div>' : '') +
      '<dl class="fx-grid">' + rows.join('') + '</dl>' + chart + '</div></section>';
  }

  /* ---------- review ---------- */
  function review(g) {
    var t = g.tier, k = reviews.indexOf(g);
    var prev = reviews[k - 1], next = reviews[k + 1];
    var body = g.blocks.map(function (b) {
      if (b.t === 'p') return '<p>' + esc(b.h) + '</p>';
      return '<figure class="' + (b.small ? 'small' : '') + '"><img src="' + IM[b.img] + '" alt="' + esc(b.cap) + '" loading="lazy">' + (b.cap ? '<figcaption>' + esc(b.cap) + '</figcaption>' : '') + '</figure>';
    }).join('') || '<p class="empty">Nothing written yet.</p>';
    function navCard(x, dir) {
      return '<a class="tier ' + dir + '" style="--h:' + x.tier.h + '" href="#' + x.slug + '" data-go="' + x.slug + '"><span class="lbl">' + (dir === 'next' ? 'Next review' : 'Previous review') + '</span><b>' + esc(x.title) + '</b><span class="nt">' + esc(x.tier.name) + '</span></a>';
    }
    app.innerHTML = topbar('<a class="back" href="#" data-go="">' + BACK + 'All reviews</a>' + (g.status === 'draft' ? '<span class="draft-flag">Draft</span>' : '<span></span>'), 'tier', '--h:' + t.h) +
      '<main class="tier" style="--h:' + t.h + '"><article class="wrap">' +
      '<div class="rv-head"><a class="crumb" href="#' + t.id + '" data-go="' + t.id + '">' + ticks(t.i) + '<span>' + esc(t.name) + '</span></a><h1>' + esc(g.title) + '</h1><div class="rv-meta"><span>' + g.mins + ' min read</span><span>' + g.words.toLocaleString('en-US') + ' words</span><span>Tier ' + (t.i + 1) + ' of ' + nT + '</span></div></div>' +
      factsPanel(g) +
      '<div class="prose">' + body + '</div>' +
      '<aside class="filed"><div class="lbl">Filed under</div><h2>' + esc(t.name) + '</h2><p>' + esc(t.desc) + '</p><a class="more" href="#' + t.id + '" data-go="' + t.id + '">See everything in ' + esc(t.name) + '</a></aside>' +
      '<nav class="nav2" aria-label="More reviews">' + (prev ? navCard(prev, 'prev') : '<span></span>') + (next ? navCard(next, 'next') : '') + '</nav>' +
      '</article></main>';
    if (spy) { spy.disconnect(); spy = null; }
    updateProgress();
  }
  function updateProgress() {
    var p = document.getElementById('prog'), a = document.querySelector('.prose');
    if (!p || !a) return;
    var r = a.getBoundingClientRect(), vh = window.innerHeight;
    var start = window.scrollY + r.top, len = Math.max(1, r.height - vh * 0.5);
    var f = Math.min(1, Math.max(0, (window.scrollY - start + vh * 0.3) / len));
    p.style.transform = 'scaleX(' + f + ')';
  }
  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', updateProgress);

  /* ---------- chart tooltip ---------- */
  function showTip(e) {
    var c = e.target.closest && e.target.closest('[data-tip]');
    if (!c) { tip.hidden = true; return; }
    var r = c.getBoundingClientRect();
    tip.textContent = c.getAttribute('data-tip'); tip.hidden = false;
    tip.style.left = (r.left + r.width / 2) + 'px'; tip.style.top = Math.max(r.top, r.bottom - 64) + 'px';
  }
  document.addEventListener('mouseover', showTip); document.addEventListener('focusin', showTip);
  document.addEventListener('scroll', function () { tip.hidden = true; }, { passive: true });

  /* ---------- routing ---------- */
  function find(key) {
    for (var i = 0; i < reviews.length; i++) if (reviews[i].slug === key) return reviews[i];
    return null;
  }
  function route() {
    var key = cur || '', g = find(key);
    if (g) {
      if (rendered !== key) {
        if (rendered === '' || rendered === null || rendered.indexOf('tier-') === 0 || !find(rendered)) homeScroll = rendered === null ? 0 : window.scrollY;
        review(g); rendered = key; window.scrollTo(0, 0);
      }
      return;
    }
    var onHome = rendered !== null && !find(rendered);
    if (!onHome) home();
    rendered = key;
    var target = key && document.getElementById(key);
    if (target) target.scrollIntoView();
    else window.scrollTo(0, onHome ? 0 : homeScroll || 0);
  }
  function go(key) {
    cur = key;
    if (!D.preview) { try { if (location.hash.slice(1) !== key) location.hash = key; } catch (e) {} }
    route();
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-go]');
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
    e.preventDefault();
    go(a.getAttribute('data-go'));
  });
  window.addEventListener('hashchange', function () { if (!D.preview) { cur = location.hash.slice(1); route(); } });
  if (D.preview != null) { var pv = reviews.filter(function (g) { return g.id === D.preview; })[0]; cur = pv ? pv.slug : ''; }
  else cur = location.hash.slice(1);
  route();
})();
</script>
</body>
</html>
